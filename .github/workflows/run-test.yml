---
name: Run Tests

on: [push, pull_request]

# WeSense runs OrbitDB in Node only, so the browser tests (and the webpack/playwright tooling they need)
# are not part of this branch. Upstream's version of this file keeps them.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm run test:ci
